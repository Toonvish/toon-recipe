# =============================================================================
# toon-recipe on a Raspberry Pi.
#
#   docker compose pull && docker compose up -d
#
# Configuration lives in a `.env` NEXT TO THIS FILE (copy docker/env.example).
# Nothing in here needs editing for a normal install.
#
# THREE SERVICES, AND NO API KEY BETWEEN THEM:
#   app      the API + the PWA, one origin, one port (see Dockerfile)
#   caddy    TLS termination, so the PWA gets the secure context it needs
#   mailpit  the local SMTP relay + a web UI for every mail the app sends
#
# What used to be a Resend API key is now `app` talking SMTP to `mailpit` over the
# private compose network. The database was already a local libSQL file, and OCR
# already ran in-process — so a working install needs no third-party account at all.
# =============================================================================

name: toon-recipe

services:
  app:
    image: ${TOON_IMAGE:-ghcr.io/toonvish/toon-recipe:latest}
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: "3001"

      # --- database & files (both inside the one volume) ---
      DATABASE_URL: "file:/app/data/local.db"
      UPLOAD_DIR: /app/data/uploads

      # --- public identity -------------------------------------------------
      # The browser reaches everything through Caddy on this hostname. WEB_ORIGIN
      # is what CORS allows and what the links in outgoing mails are built from, so
      # it must be the address a phone actually uses — not `localhost`.
      WEB_ORIGIN: "https://${TOON_HOSTNAME}"
      OAUTH_REDIRECT_BASE: "https://${TOON_HOSTNAME}"
      # EMPTY on purpose: the bundle then uses relative URLs and the API serves it
      # from the same origin. Do not set this to an absolute address.
      PUBLIC_API_URL: ""

      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt - siehe docker/env.example}

      # Caddy sits in front and OVERWRITES X-Forwarded-For (see docker/Caddyfile).
      # That overwrite is what makes trusting the header safe here; without it every
      # rate limit would be bypassable by sending your own header.
      TRUST_PROXY: "1"

      # --- mail: the local relay, no API key -------------------------------
      MAIL_TRANSPORT: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      # Plaintext is acceptable here and ONLY here: the hop never leaves the
      # private compose network, and Mailpit needs no credentials — which is why
      # env.ts refuses to combine `none` with a user/password.
      MAIL_SECURITY: none
      MAIL_FROM: ${MAIL_FROM:-Rezepte <rezepte@localhost>}

      TESSERACT_LANGS: ${TESSERACT_LANGS:-deu+eng}

      # --- OAuth (optional, third party by definition) ---------------------
      # Left empty by default: e-mail + password is the self-hosted path and needs
      # nobody's servers. Fill these in only if you want Google/GitHub sign-in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      # The database, the uploads and the OCR language cache. THIS is the volume to
      # back up — see docs/deployment.md.
      - toon-data:/app/data
    # No published port: only Caddy may reach the app. Publishing 3001 as well
    # would offer the same site over plain http, where the PWA silently does not
    # work and the session cookie loses its Secure flag.
    expose:
      - "3001"
    networks:
      - toon
    # A Pi 4 with 2 GB has no swap headroom to spare, and a tesseract worker on a
    # 12 MP photo is the one thing here that can grow without bound.
    mem_limit: ${TOON_MEM_LIMIT:-1500m}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # Pinned rather than `2-alpine`: a floating tag means `docker compose pull`
    # can change the TLS terminator underneath a running install, and the symptom
    # of a bad Caddy release is "the whole site is gone", on a machine you reach
    # over that same site. Bump deliberately.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      TOON_HOSTNAME: ${TOON_HOSTNAME:?TOON_HOSTNAME fehlt - siehe docker/env.example}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data holds the local CA — INCLUDING ITS PRIVATE KEY. Losing this
      # volume means a new CA, which means re-installing the root certificate on
      # every phone. Keep it out of any backup you would share.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - toon
    logging: *logging

  mailpit:
    # Pinned for the same reason as Caddy. `:latest` would also let a future major
    # (v2) arrive on a `docker compose pull` and change the SMTP or UI behaviour
    # this deployment depends on.
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      # Keep the mailbox bounded; these are notifications, not an archive.
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # ⚠ 127.0.0.1 ON PURPOSE — NOT a LAN port.
      #
      # This UI shows every mail the app sends, and those mails contain PASSWORD
      # RESET AND INVITE LINKS. Anyone who can open it can take over any account by
      # requesting a reset. Bound to the Pi's loopback interface it is reachable
      # only over SSH:
      #
      #     ssh -N -L 8025:127.0.0.1:8025 <user>@<pi>
      #     then open http://localhost:8025
      #
      # If you would rather have it on the LAN, understand that trade-off first and
      # put a password in front of it (Caddy `basic_auth`).
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    networks:
      - toon
    logging: *logging

networks:
  toon:
    driver: bridge

volumes:
  toon-data:
  caddy-data:
  caddy-config:
  mailpit-data:
