# =============================================================================
# toon-recipe — the whole deployment, on any Linux box with Docker.
#
#   docker compose pull && docker compose up -d
#
# Configuration lives in a `.env` NEXT TO THIS FILE (copy docker/env.example).
# For the default setup — a small VPS with a domain — only TOON_HOSTNAME,
# SESSION_SECRET and the mail relay need a value.
#
# THREE SERVICES, AND NO API KEY REQUIRED BETWEEN THEM:
#   app      the API + the PWA, one origin, one port (see Dockerfile)
#   caddy    TLS termination, so the PWA gets the secure context it needs
#   mailpit  a local SMTP sink + a web UI, used until a real relay is configured
#
# Mail is the one thing with a choice to make: out of the box `app` talks SMTP to
# `mailpit` over the private compose network, which COLLECTS mail and delivers
# nothing — fine for a first look, useless for a password reset to an actual
# inbox. Point MAIL_HOST/MAIL_USER/… at a real relay in the `.env` when you want
# delivery; the adapter is the same either way. The database was always a local
# libSQL file, so there is still no third-party account needed to run this.
# =============================================================================

name: toon-recipe

services:
  app:
    image: ${TOON_IMAGE:-ghcr.io/toonvish/toon-recipe:latest}
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: "3001"

      # --- database & files (both inside the one volume) ---
      DATABASE_URL: "file:/app/data/local.db"
      UPLOAD_DIR: /app/data/uploads

      # --- public identity -------------------------------------------------
      # The browser reaches everything through Caddy on this hostname. WEB_ORIGIN
      # is what CORS allows and what the links in outgoing mails are built from, so
      # it must be the address a phone actually uses — not `localhost`.
      WEB_ORIGIN: "https://${TOON_HOSTNAME}"
      OAUTH_REDIRECT_BASE: "https://${TOON_HOSTNAME}"
      # EMPTY on purpose: the bundle then uses relative URLs and the API serves it
      # from the same origin. Do not set this to an absolute address.
      PUBLIC_API_URL: ""

      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt - siehe docker/env.example}

      # Caddy sits in front and OVERWRITES X-Forwarded-For (see docker/Caddyfile).
      # That overwrite is what makes trusting the header safe here; without it every
      # rate limit would be bypassable by sending your own header.
      TRUST_PROXY: "1"

      # --- mail ------------------------------------------------------------
      # The defaults are the Mailpit container next door: it needs no credentials
      # and nothing leaves the machine, so plaintext SMTP is acceptable on that hop
      # and ONLY there — which is why env.ts refuses to combine MAIL_SECURITY=none
      # with a user/password. For real delivery set MAIL_HOST/MAIL_PORT/
      # MAIL_SECURITY/MAIL_USER/MAIL_PASSWORD in the `.env`; see
      # docs/deployment.md ("Mailversand einrichten").
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURITY: ${MAIL_SECURITY:-none}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Rezepte <rezepte@localhost>}
      # Read ONLY for MAIL_TRANSPORT=resend, and then required — env.ts refuses to
      # boot without it. It has to be passed through even though the default stack
      # does not use it: without this line `MAIL_TRANSPORT=resend` in the `.env`
      # produces a container that cannot start, and the missing value is in a file
      # the operator did fill in. Empty is correct for every SMTP setup, including
      # Resend's own smtp.resend.com (there the key is MAIL_PASSWORD).
      MAIL_API_KEY: ${MAIL_API_KEY:-}

      # Photo/PDF import. Off by default, matching an image built WITHOUT the
      # `WITH_OCR=1` build arg: the binaries are not installed, so there is nothing
      # to enable. It also wants ~2 GB of RAM, which the cheap end of the VPS market
      # does not have. Set both (build arg AND this) to turn it on — see
      # docs/deployment.md.
      IMPORT_OCR_ENABLED: ${IMPORT_OCR_ENABLED:-0}
      TESSERACT_LANGS: ${TESSERACT_LANGS:-deu+eng}

      # --- OAuth (optional, third party by definition) ---------------------
      # Left empty by default: e-mail + password is the self-hosted path and needs
      # nobody's servers. Fill these in only if you want Google/GitHub sign-in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      # The database and the uploads. THIS is the volume to back up — see
      # docs/deployment.md.
      - toon-data:/app/data
    # No published port: only Caddy may reach the app. Publishing 3001 as well
    # would offer the same site over plain http, where the PWA silently does not
    # work and the session cookie loses its Secure flag.
    expose:
      - "3001"
    networks:
      - toon
    # Without photo/PDF import this container is Bun, a libSQL file and the static
    # PWA — a few hundred MB is plenty, and a limit below the machine's RAM is what
    # keeps a runaway request from taking the Docker daemon with it. With OCR on,
    # raise it: a tesseract worker on a 12 MP photo is the one thing here that can
    # grow without bound. See docker/env.example.
    mem_limit: ${TOON_MEM_LIMIT:-768m}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # Pinned rather than `2-alpine`: a floating tag means `docker compose pull`
    # can change the TLS terminator underneath a running install, and the symptom
    # of a bad Caddy release is "the whole site is gone", on a machine you reach
    # over that same site. Bump deliberately.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      TOON_HOSTNAME: ${TOON_HOSTNAME:?TOON_HOSTNAME fehlt - siehe docker/env.example}
      # `acme` (default) = a real Let's Encrypt certificate, needs a public
      # hostname and ports 80/443. `internal` = Caddy's local CA for a LAN box or
      # a local test, and then TOON_HSTS_MAX_AGE=0 belongs with it.
      TOON_TLS_ISSUER: ${TOON_TLS_ISSUER:-acme}
      TOON_HSTS_MAX_AGE: ${TOON_HSTS_MAX_AGE:-31536000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy-data holds the ACME account and certificates — and in `internal`
      # mode the local CA INCLUDING ITS PRIVATE KEY. Losing it there means a new
      # CA, which means re-installing the root certificate on every phone. Keep it
      # out of any backup you would share.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - toon
    logging: *logging

  mailpit:
    # Pinned for the same reason as Caddy. `:latest` would also let a future major
    # (v2) arrive on a `docker compose pull` and change the SMTP or UI behaviour
    # this deployment depends on.
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      # Keep the mailbox bounded; these are notifications, not an archive.
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # ⚠ 127.0.0.1 ON PURPOSE — NOT a public or LAN port.
      #
      # This UI shows every mail the app sends, and those mails contain PASSWORD
      # RESET AND INVITE LINKS. Anyone who can open it can take over any account by
      # requesting a reset. Bound to the server's loopback interface it is
      # reachable only over SSH:
      #
      #     ssh -N -L 8025:127.0.0.1:8025 <user>@<server>
      #     then open http://localhost:8025
      #
      # If you would rather have it reachable directly, understand that trade-off
      # first and put a password in front of it (Caddy `basic_auth`).
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    networks:
      - toon
    logging: *logging

networks:
  toon:
    driver: bridge

volumes:
  toon-data:
  caddy-data:
  caddy-config:
  mailpit-data:
