# =============================================================================
# toon-recipe — the whole deployment, on any Linux box with Docker.
#
#   docker compose pull && docker compose up -d
#
# Configuration lives in a `.env` NEXT TO THIS FILE (copy docker/env.example).
# For the default setup — a small VPS with a domain — only TOON_HOSTNAME,
# SESSION_SECRET and the mail relay need a value.
#
# ONE SERVICE, AND NO API KEY REQUIRED ANYWHERE:
#   app      the API + the PWA, one origin, one port (see Dockerfile)
#
# TLS TERMINATION IS NOT IN THIS FILE ANY MORE. It moved to the `toon-edge` stack
# (/opt/toon-edge), a single shared Caddy that owns ports 80/443 for every toon app
# on the host and routes by hostname. This stack used to ship its own Caddy, which
# works for exactly one app per machine: the second app's `docker compose up -d`
# dies with "port is already allocated". Nothing about the app changed — it still
# serves its own `/` on its own hostname; only the proxy is shared.
#
# THIS STACK THEREFORE NEEDS THE SHARED NETWORK TO EXIST FIRST:
#
#     docker network create toon-edge     # once per machine
#
# and `TOON_TLS_ISSUER` / `TOON_HSTS_MAX_AGE` now live in /opt/toon-edge/.env,
# not here. See the toon-edge README for the full runbook.
#
# Mail is the one thing with a choice to make, and with NO mail values set the app
# logs every reset/invite link instead of sending it (the ConsoleMailer) — a
# working install without a mail account, and one the UI reports honestly as
# "not configured" rather than as a successful send. Point MAIL_HOST/MAIL_USER/…
# at any provider's SMTP access, or set MAIL_TRANSPORT=resend + MAIL_API_KEY, when
# you want delivery to a real inbox; the adapter is the same either way. There used
# to be a third service here, a Mailpit container acting as a local SMTP sink — it
# was only ever a viewer for mail that went nowhere, so a deployment with a relay
# configured carried it for nothing. The database was always a local libSQL file,
# so there is still no third-party account NEEDED to run this.
# =============================================================================

name: toon-recipe

services:
  app:
    image: ${TOON_IMAGE:-ghcr.io/toonvish/toon-recipe:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3001"

      # --- database & files (both inside the one volume) ---
      DATABASE_URL: "file:/app/data/local.db"
      UPLOAD_DIR: /app/data/uploads

      # --- public identity -------------------------------------------------
      # The browser reaches everything through Caddy on this hostname. WEB_ORIGIN
      # is what CORS allows and what the links in outgoing mails are built from, so
      # it must be the address a phone actually uses — not `localhost`.
      WEB_ORIGIN: "https://${TOON_HOSTNAME}"
      OAUTH_REDIRECT_BASE: "https://${TOON_HOSTNAME}"
      # EMPTY on purpose: the bundle then uses relative URLs and the API serves it
      # from the same origin. Do not set this to an absolute address.
      PUBLIC_API_URL: ""

      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt - siehe docker/env.example}

      # Caddy sits in front and OVERWRITES X-Forwarded-For (see docker/Caddyfile).
      # That overwrite is what makes trusting the header safe here; without it every
      # rate limit would be bypassable by sending your own header.
      TRUST_PROXY: "1"

      # --- mail ------------------------------------------------------------
      # Unset means the ConsoleMailer: reset and invite links go to the container
      # log and nothing is delivered. That is a deliberate state, not a silent
      # failure — `mailDeliveryOf()` reports it as `not_configured` and the UI
      # says so instead of claiming a mail went out.
      #
      # For real delivery, either any provider's SMTP access (MAIL_TRANSPORT=smtp
      # plus MAIL_HOST and, if the relay authenticates, MAIL_USER/MAIL_PASSWORD)
      # or Resend's HTTP API (MAIL_TRANSPORT=resend plus MAIL_API_KEY). See
      # docs/deployment.md ("Mailversand einrichten").
      #
      # These pass through EMPTY rather than carrying a default: an empty value
      # counts as unset (env.ts `rawEnv()`), so the defaults live in one place —
      # MAIL_SECURITY=starttls on port 587, or 465 with MAIL_SECURITY=tls. There is
      # no relay on the private network any more, so `none` is no longer a sensible
      # default: it would now put credentials on the wire in cleartext, which
      # env.ts refuses to do at all.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_SECURITY: ${MAIL_SECURITY:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Rezepte <rezepte@localhost>}
      # Read ONLY for MAIL_TRANSPORT=resend, and then required — env.ts refuses to
      # boot without it. It has to be passed through even though the default stack
      # does not use it: without this line `MAIL_TRANSPORT=resend` in the `.env`
      # produces a container that cannot start, and the missing value is in a file
      # the operator did fill in. Empty is correct for every SMTP setup, including
      # Resend's own smtp.resend.com (there the key is MAIL_PASSWORD).
      MAIL_API_KEY: ${MAIL_API_KEY:-}

      # Photo and PDF import, two separate flags. Both off by default, matching an
      # image built WITHOUT the `WITH_OCR=1` / `WITH_PDF=1` build args: the binaries
      # are not installed, so there is nothing to enable. Set the build arg AND the
      # variable to turn one on — see docs/deployment.md.
      #
      # The 1 GB combination is `IMPORT_OCR_ENABLED=1` with `IMPORT_PDF_ENABLED=0`:
      # German photo import fits one core, a ten-page scan does not.
      IMPORT_OCR_ENABLED: ${IMPORT_OCR_ENABLED:-0}
      # DEFAULTS TO 0 RATHER THAN TO "follow IMPORT_OCR_ENABLED", even though the API
      # itself treats unset as "follow". The published image ships WITHOUT poppler
      # (release.yml builds WITH_PDF=0), so inheriting the photo flag would turn PDF
      # import on against an image that cannot do it — the endpoint would advertise
      # itself and then answer the documented 422. Turning PDFs on needs BOTH this
      # variable and an image built with `--build-arg WITH_PDF=1`.
      IMPORT_PDF_ENABLED: ${IMPORT_PDF_ENABLED:-0}
      TESSERACT_LANGS: ${TESSERACT_LANGS:-deu}
      # Peak concurrent tesseract processes, i.e. the memory ceiling. 1 is right for
      # one core; raise it only after measuring with `docker stats`.
      IMPORT_OCR_CONCURRENCY: ${IMPORT_OCR_CONCURRENCY:-1}

      # --- OAuth (optional, third party by definition) ---------------------
      # Left empty by default: e-mail + password is the self-hosted path and needs
      # nobody's servers. Fill these in only if you want Google/GitHub sign-in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      # The database and the uploads. THIS is the volume to back up — see
      # docs/deployment.md.
      - toon-data:/app/data
    # No published port: only Caddy may reach the app. Publishing 3001 as well
    # would offer the same site over plain http, where the PWA silently does not
    # work and the session cookie loses its Secure flag.
    expose:
      - "3001"
    networks:
      # `recipe-app` IS LOAD-BEARING, not decoration. toon-finance also calls its
      # service `app`, and compose registers the SERVICE NAME as an alias on every
      # network a container joins — so on the shared edge network two containers
      # would answer to `app` and Caddy would round-robin between the recipe and
      # the finance app. It fails silently: the page loads, every other request
      # comes from the wrong application. The alias is what the Caddyfile targets.
      edge:
        aliases:
          - recipe-app
    # Without photo/PDF import this container is Bun, a libSQL file and the static
    # PWA — a few hundred MB is plenty, and a limit below the machine's RAM is what
    # keeps a runaway request from taking the Docker daemon with it. With OCR on,
    # raise it: a tesseract worker on a 12 MP photo is the one thing here that can
    # grow without bound. See docker/env.example.
    mem_limit: ${TOON_MEM_LIMIT:-768m}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # EXTERNAL, and created by hand once (`docker network create toon-edge`). It is
  # shared with the toon-edge proxy and every other toon app on the host, so it
  # belongs to none of them: that way `docker compose down` here never tries to
  # tear down a network the other stacks are still using.
  edge:
    external: true
    name: toon-edge

volumes:
  # The database and the uploads. THIS is the volume to back up — see
  # docs/deployment.md. caddy-data/caddy-config are gone from this stack; the
  # certificates live in the toon-edge project now.
  toon-data:
