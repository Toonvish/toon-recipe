# Builds the container image for the Raspberry Pi and publishes it to GHCR.
#
# ARM64 IS THE POINT: a Pi 4/5 on 64-bit Raspberry Pi OS is `linux/arm64`, and
# there is no Bun build for 32-bit ARM at all. amd64 is built alongside it purely
# so the same image can be run on a laptop for testing.
#
# HOW THE CROSS-BUILD STAYS FAST: the Dockerfile builds the web bundle and the
# tesseract language data on the BUILD platform (`--platform=$BUILDPLATFORM`),
# because both outputs are architecture-independent. Only the native node_modules
# install runs under QEMU. Without that split, a full arm64 build under emulation
# takes roughly ten times as long.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Nach dem Build auf den Pi deployen"
        type: boolean
        default: false

concurrency:
  # Never let two publishes race for the `latest` tag.
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # Publishing an image that fails its own test suite is not a release.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      # QEMU is what lets an amd64 runner produce arm64 layers.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance: false keeps the manifest list a plain multi-arch index.
          # The attestation manifests that buildx adds otherwise confuse older
          # dockers, and the Pi's is often exactly that old.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image veröffentlicht"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploys over SSH. Split into its own job so a failed deploy never un-publishes
  # a good image, and gated on the `production` environment so GitHub can require a
  # manual approval before anything touches the Pi.
  deploy:
    needs: build
    # A push to main or a version tag deploys automatically. A manual run only
    # deploys when the checkbox was ticked — without the event check below, the
    # `refs/heads/main` clause would deploy anyway and the input would be a lie.
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    uses: ./.github/workflows/deploy.yml
    with:
      image_digest: ${{ needs.build.outputs.digest }}
    secrets: inherit
