# Builds the container image and publishes it to GHCR.
#
# TWO ARCHITECTURES, BOTH DELIBERATE: amd64 is the ordinary x86 VPS (and a laptop
# for testing), arm64 covers the cheap ARM instances and an Apple-Silicon dev
# machine. 32-bit is not buildable at all — there is no Bun for it.
#
# HOW THE CROSS-BUILD STAYS FAST: the Dockerfile builds the web bundle on the BUILD
# platform (`--platform=$BUILDPLATFORM`), because its output is
# architecture-independent. Only the native node_modules install runs under QEMU.
# Without that split, a full arm64 build under emulation takes roughly ten times as
# long.
name: Release

#
# BUILD ONLY — there is no deploy stage on purpose. Deployment is a manual
# `docker compose pull && docker compose up -d` on the server (see
# docs/deployment.md), so CI never holds an SSH key to the box.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # Never let two publishes race for the `latest` tag.
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # No job `outputs`: the deploy job that consumed the digest is gone. It is
    # published in the step summary instead, which is where a human reads it.
    steps:
      - uses: actions/checkout@v5

      # Publishing an image that fails its own test suite is not a release.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

      # `pdf-rasterize.test.ts` drives the REAL pdftoppm and fails rather than skips
      # when the binary is missing, so this step is as load-bearing here as it is in
      # ci.yml — a release that skipped it published an image whose rasterize+OCR
      # fallback nobody had exercised. tesseract is NOT needed: no test runs real OCR.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils

      - run: bun test

      # QEMU is what lets an amd64 runner produce arm64 layers.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance: false keeps the manifest list a plain multi-arch index.
          # The attestation manifests that buildx adds otherwise confuse older
          # dockers, and a distro-packaged docker on a small server is often
          # exactly that old.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is the useful half of this summary: it is what you paste into the
      # server's `.env` as TOON_IMAGE to deploy exactly this build instead of a
      # moving `:latest`.
      - name: Summary
        run: |
          {
            echo "### Image veröffentlicht"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Deploy auf dem Server (in \`/opt/toon-recipe\`):"
            echo
            echo '```bash'
            echo "docker compose pull && docker compose up -d --remove-orphans"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
